name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image: ${{ steps.version.outputs.image }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate version before any build or write
        id: version
        run: python .github/scripts/release_metadata.py

  checks:
    needs: validate
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository] -- Keep syntax compatible with actionlint 1.7.12.

  image:
    needs: [validate, checks]
    permissions:
      contents: read
      packages: write
      security-events: write
    uses: ./.github/workflows/docker-build.yml # zizmor: ignore[self-repository] -- Keep syntax compatible with actionlint 1.7.12.
    with:
      image: ${{ needs.validate.outputs.image }}
      tag: ${{ needs.validate.outputs.tag }}
      version: ${{ needs.validate.outputs.version }}
      prerelease: ${{ fromJSON(needs.validate.outputs.prerelease) }}

  create-release:
    needs: [validate, image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Create release after both platforms pass security checks
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          IMAGE_DIGEST: ${{ needs.image.outputs.image }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          printf 'Imagen verificada: %s\n' "$IMAGE_DIGEST" > release-notes.md
          flags=(--verify-tag --generate-notes --notes-file release-notes.md --title "SismosVE $RELEASE_TAG")
          if [[ "$PRERELEASE" == 'true' ]]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" "${flags[@]}" VERSION CHANGELOG.md docker-compose.yml nginx.conf requirements.txt
