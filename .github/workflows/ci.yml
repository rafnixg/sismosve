name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - run: python -m pip install PyYAML==6.0.3 zizmor==1.31.1
      - name: Validate release policy and helper scripts
        run: python .github/scripts/check_workflows.py
      - name: Validate Actions syntax and shell scripts
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$RUNNER_TEMP/bin/actionlint" -color
      - name: Audit workflow security
        run: zizmor --offline --no-config --strict-collection .github/workflows

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate and build frontend once
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high
          npm run check
          npm test
          npm run build
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: frontend-dist
          path: static/ui/
          include-hidden-files: true # Vite's .vite/manifest.json is required by the backend.
          if-no-files-found: error
          retention-days: 1

  test:
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt pytest httpx flake8
      - name: Check Python syntax and undefined names
        run: flake8 app updater.py test_app.py test_ui.py test_storage.py --select=E9,F63,F7,F82 --show-source
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: static/ui/
      - name: Verify API, SEO and persistent storage
        env:
          TESTING: 'true'
        run: python -m pytest test_app.py test_ui.py test_storage.py -q
      - name: Audit resolved Python dependencies
        if: matrix.python-version == '3.14'
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit -r requirements.txt --progress-spinner off
