name: Build and Push Docker Image

# Only release.yml calls this workflow, after validating a pushed version tag.
on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
      tag:
        required: true
        type: string
      version:
        required: true
        type: string
      prerelease:
        required: true
        type: boolean
    outputs:
      image:
        description: Verified multi-platform image reference by digest
        value: ${{ jobs.build-and-push.outputs.image }}

permissions:
  contents: read

jobs:
  build-and-push:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ inputs.image }}@${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build versioned images with SBOM and provenance
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          pull: true
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ inputs.version }}
            SOURCE_URL=https://github.com/${{ github.repository }}/archive/${{ github.sha }}.tar.gz
          tags: |
            ${{ inputs.image }}:${{ inputs.tag }}
            ${{ inputs.image }}:${{ inputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.version }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=release
          cache-to: type=gha,scope=release,mode=max

  security-scan:
    needs: build-and-push
    permissions:
      contents: read
      packages: read
      security-events: write
    uses: ./.github/workflows/container-scan.yml # zizmor: ignore[self-repository] -- Keep syntax compatible with actionlint 1.7.12.
    with:
      image: ${{ needs.build-and-push.outputs.image }}

  promote-latest:
    needs: [build-and-push, security-scan]
    if: ${{ !inputs.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Promote the scanned manifest without rebuilding
        env:
          IMAGE: ${{ inputs.image }}
          IMAGE_DIGEST: ${{ needs.build-and-push.outputs.image }}
        run: docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE_DIGEST"
