name: Container security scan

on:
  workflow_call:
    inputs:
      image:
        description: Published image reference pinned by digest
        required: true
        type: string

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Scan the published digest, including unfixed vulnerabilities
        id: scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          image-ref: ${{ inputs.image }}
          scanners: vuln
          format: json
          output: trivy.json
          list-all-pkgs: 'true'
          ignore-unfixed: false
          exit-code: '0' # Upload evidence before enforcing the gate below.
          timeout: 10m
          cache: 'false'
        env:
          TRIVY_PLATFORM: linux/${{ matrix.arch }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ github.token }}
      - name: Generate SARIF and SBOM from the same scan
        run: |
          trivy convert --format sarif --output trivy.sarif trivy.json
          trivy convert --format spdx-json --output sbom.spdx.json trivy.json
      - name: Upload security alerts
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          sarif_file: trivy.sarif
          category: container/linux-${{ matrix.arch }}
      - name: Preserve scan reports even if SARIF upload fails
        if: ${{ !cancelled() && steps.scan.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: container-security-${{ matrix.arch }}
          path: |
            trivy.json
            trivy.sarif
            sbom.spdx.json
          if-no-files-found: error
          retention-days: 30
      - name: Block HIGH and CRITICAL vulnerabilities
        if: ${{ !cancelled() && steps.scan.outcome == 'success' }}
        run: python .github/scripts/check_vulnerabilities.py trivy.json
