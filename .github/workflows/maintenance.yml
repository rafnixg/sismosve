name: Maintenance

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maintenance
  cancel-in-progress: false

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: python -m pip install pip-audit==2.10.1
      - name: Audit application Python requirements
        run: pip-audit -r requirements.txt --progress-spinner off --format json --output pip-audit.json
      - name: Audit frontend lockfile
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: npm audit --audit-level=high --json > ../npm-audit.json
      - name: Preserve dependency reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dependency-security
          path: |
            pip-audit.json
            npm-audit.json
          if-no-files-found: error
          retention-days: 30

  published-image:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    outputs:
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Resolve the existing latest image without building
        id: resolve
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          image="ghcr.io/${REPOSITORY,,}:latest"
          docker pull "$image"
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$image")
          printf 'image=%s\n' "$digest" >> "$GITHUB_OUTPUT"

  security-scan:
    needs: published-image
    permissions:
      contents: read
      packages: read
      security-events: write
    uses: ./.github/workflows/container-scan.yml # zizmor: ignore[self-repository] -- Keep syntax compatible with actionlint 1.7.12.
    with:
      image: ${{ needs.published-image.outputs.image }}

  health-check:
    needs: published-image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Test the published digest
        env:
          IMAGE: ${{ needs.published-image.outputs.image }}
        run: |
          docker run -d --name health-test -p 127.0.0.1:8000:8000 "$IMAGE"
          for _ in {1..30}; do
            if curl --fail --silent --max-time 3 http://127.0.0.1:8000/api/health > health.json; then
              if jq -e '.status == "healthy"' health.json; then
                exit 0
              fi
            fi
            sleep 2
          done
          docker logs health-test
          exit 1
      - name: Always clean up the test container
        if: ${{ always() }}
        run: docker rm -f health-test
